Section "ServerLayout"
    Identifier     "BasicLayout"
    Screen         0 "Screen0"
    InputDevice    "Keyboard0"
    InputDevice    "Mouse0"
EndSection

Section "InputDevice"
    Identifier     "Keyboard0"
    Driver         "kbd"
    Option         "XkbModel" "pc105"
    Option         "XkbLayout" "us"
EndSection

Section "InputDevice"
    Identifier     "Mouse0"
    Driver         "mouse"
    Option         "Protocol" "PS/2"
    Option         "Device" "/dev/input/mice"
EndSection

Section "Monitor"
    Identifier     "Monitor0"
    HorizSync      30-83
    VertRefresh    56-75
    Option         "DPMS"
EndSection

Section "Device"
    Identifier     "Card0"
    Driver         "vesa"           # or "modesetting" or "fbdev" if no vesa
    Option         "AccelMethod" "none"
EndSection

Section "Screen"
    Identifier     "Screen0"
    Device         "Card0"
    Monitor        "Monitor0"
    DefaultDepth   24
    SubSection     "Display"
        Depth      24
        Modes      "1024x768"
    EndSubSection
EndSection

